[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "release-slotcheck"
version = "0.1.0"
description = "Validate release asset slots against a contract."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = []

[project.scripts]
release-slotcheck = "release_slotcheck.cli:main"

[project.urls]
Homepage = "https://github.com/KanadeK/release-slotcheck"
Issues = "https://github.com/KanadeK/release-slotcheck/issues"

[tool.setuptools.packages.find]
include = ["release_slotcheck*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
